<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1810">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>حساب من | شیرین‌کده پاریس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<style>
:root{
  --ivory:#fbf6ec;--cream:#f4e9d4;--cream-2:#ead9bb;
  --choc:#2b1810;--choc-2:#3d2418;--choc-3:#5a3a28;
  --caramel:#b8742f;--caramel-2:#d49a52;
  --gold:#c9a24d;--gold-2:#e6cd85;
  --ink:#2b1810;--muted:#7a6552;--line:rgba(91,58,40,.15);
  --ok:#2f6b46;--danger:#a63d33;
  --r:20px;--shadow:0 10px 34px -14px rgba(43,24,16,.35);
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--ink);line-height:1.8;
  background:radial-gradient(1200px 700px at 85% -10%,#fff9ec 0,transparent 60%),radial-gradient(900px 600px at 0% 100%,#efdcb9 0,transparent 55%),var(--cream);
  overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--caramel);text-decoration:none}
img{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;top:-60px;right:12px;background:var(--choc);color:var(--ivory);padding:10px 16px;border-radius:12px;z-index:100}
.skip:focus{top:10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:10px}
.hidden{display:none!important}
bdi,.ltr{unicode-bidi:isolate}.ltr{direction:ltr;display:inline-block}

/* background layers */
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.95}
.orb{position:fixed;z-index:0;border-radius:50%;filter:blur(60px);pointer-events:none;opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.orb.a{width:340px;height:340px;background:#e6cd85;top:-80px;left:-60px}
.orb.b{width:300px;height:300px;background:#d49a52;bottom:-90px;right:-40px;animation-delay:-8s}
html.gl .orb{display:none}
@keyframes drift{to{transform:translate3d(40px,30px,0) scale(1.12)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.page{position:relative;z-index:2}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(43,24,16,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,162,77,.35)}
.top .in{max-width:1180px;margin:auto;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;color:var(--gold-2);font-weight:800;font-size:17px}
.brand svg{width:30px;height:30px;flex:none}
.top .acts{display:flex;gap:8px;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.65);color:var(--ink);
  padding:10px 18px;border-radius:14px;cursor:pointer;font-weight:600;font-size:14px;transition:transform .25s var(--ease),box-shadow .25s,background .25s;min-height:44px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(43,24,16,.5)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}
.btn.gold{background:linear-gradient(135deg,var(--gold) 0,var(--gold-2) 55%,var(--gold) 100%);border-color:var(--gold);color:var(--choc);font-weight:800}
.btn.dark{background:var(--choc);color:var(--ivory);border-color:var(--choc)}
.btn.line{background:transparent;color:var(--gold-2);border-color:rgba(230,205,133,.5)}
.btn.danger{color:var(--danger);border-color:rgba(166,61,51,.4);background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn.block{width:100%}

/* shell */
.shell{max-width:1180px;margin:auto;padding:18px 16px 60px;display:grid;grid-template-columns:1fr;gap:18px}
.side{display:none}
.pills{position:sticky;top:57px;z-index:20;margin:0 -16px;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;background:linear-gradient(var(--cream) 70%,transparent)}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:none;scroll-snap-align:center;display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--choc-3);font-weight:600;font-size:14px;transition:all .3s var(--ease)}
.pills a[aria-current=page]{background:var(--choc);color:var(--gold-2);border-color:var(--choc);box-shadow:0 6px 16px -8px rgba(43,24,16,.6)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

@media(min-width:960px){
  .shell{grid-template-columns:250px minmax(0,1fr);gap:26px;padding-top:28px}
  .pills{display:none}
  .side{display:block;position:sticky;top:84px;align-self:start}
  .side nav{display:grid;gap:6px}
  .side nav a{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;color:var(--choc-3);font-weight:600;transition:all .3s var(--ease)}
  .side nav a:hover{background:rgba(255,255,255,.7);transform:translateX(-4px)}
  .side nav a[aria-current=page]{background:var(--choc);color:var(--gold-2);box-shadow:var(--shadow)}
}

/* cards */
.card{background:rgba(255,252,245,.9);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
@supports(backdrop-filter:blur(6px)){.card{background:rgba(255,252,245,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}}
h1,h2,h3{margin:0;line-height:1.5}
h2{font-size:20px;font-weight:800;color:var(--choc)}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stack{display:grid;gap:16px}
.panel{animation:rise .55s var(--ease) both}
.panel>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translate3d(0,22px,0)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 20px;color:var(--ivory);background:linear-gradient(140deg,#2b1810 0,#46281a 55%,#2b1810 100%);border:1px solid rgba(201,162,77,.5);box-shadow:0 24px 50px -22px rgba(43,24,16,.8);display:grid;gap:22px}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 220px at 15% 0,rgba(230,205,133,.28),transparent 70%);pointer-events:none}
.hero h1{font-size:24px;font-weight:800;color:var(--gold-2)}
.hero p{margin:6px 0 0;color:#e8d8bd}
.hero .eyebrow{font-size:12px;letter-spacing:.04em;color:var(--caramel-2);font-weight:700}
@media(min-width:760px){.hero{grid-template-columns:1.2fr 1fr;align-items:center;padding:32px}.hero h1{font-size:30px}}

/* 3D member card */
.mwrap{perspective:900px;display:flex;justify-content:center}
.mcard{--rx:0deg;--ry:0deg;position:relative;width:100%;max-width:340px;aspect-ratio:1.62;border-radius:20px;padding:18px;color:var(--ivory);
  background:linear-gradient(145deg,#4a2c1c 0,#2b1810 60%,#1d0f09 100%);border:1px solid rgba(230,205,133,.65);
  box-shadow:0 30px 40px -24px #000,inset 0 0 0 1px rgba(230,205,133,.12);transform:rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;transition:transform .25s var(--ease);
  display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.mcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,235,180,.22) 48%,transparent 66%);transform:translateX(var(--sx,-120%));transition:transform .8s var(--ease);pointer-events:none}
.mcard:hover::after{--sx:120%}
.mcard .lg{display:flex;justify-content:space-between;align-items:center;transform:translateZ(30px)}
.mcard .lg b{color:var(--gold-2);font-size:15px}
.mcard .num{font-size:19px;letter-spacing:.14em;color:var(--gold-2);transform:translateZ(40px);font-weight:700}
.mcard .nm{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;transform:translateZ(24px);font-size:13px;color:#e8d8bd}
.mcard .nm b{display:block;color:var(--ivory);font-size:15px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{padding:16px;border-radius:18px;background:rgba(255,252,245,.85);border:1px solid var(--line);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.stat::after{content:"";position:absolute;inset-inline-end:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,77,.3),transparent 70%)}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--caramel);line-height:1.4}
.stat span{font-size:13px;color:var(--muted)}

/* quick links */
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.quick{grid-template-columns:repeat(5,minmax(0,1fr))}}
.quick a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:18px;background:rgba(255,252,245,.85);border:1px solid var(--line);color:var(--choc-3);font-weight:600;font-size:14px;transition:transform .3s var(--ease),box-shadow .3s}
.quick a:hover{transform:translateY(-5px) rotateX(6deg);box-shadow:0 16px 26px -16px rgba(43,24,16,.55)}
.quick .ico{width:26px;height:26px;color:var(--caramel)}

/* badges */
.badge{display:inline-flex;align-items:center;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.b-pend{background:#f6e6c9;color:#8a5a1d;border-color:#e8cf9d}
.b-prep{background:#f1deb0;color:#6d4f0a;border-color:#dfc378}
.b-ship{background:#e6d5c6;color:#5a3a28;border-color:#cfb39b}
.b-done{background:#dcecdf;color:var(--ok);border-color:#b7d5be}
.b-canc{background:#f2d9d5;color:var(--danger);border-color:#e3b5ae}

/* timeline */
.tl{list-style:none;margin:18px 0 6px;padding:0;display:flex;position:relative}
.tl::before,.tl::after{content:"";position:absolute;top:11px;height:3px;border-radius:3px;inset-inline-start:12.5%}
.tl::before{width:75%;background:var(--cream-2)}
.tl::after{width:calc(25% * var(--p,0));background:linear-gradient(90deg,var(--gold),var(--caramel));transition:width 1s var(--ease)}
.tl li{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;z-index:1}
.tl .dot{width:26px;height:26px;border-radius:50%;background:var(--ivory);border:3px solid var(--cream-2);transition:all .5s var(--ease)}
.tl .lb{font-size:11.5px;color:var(--muted);line-height:1.5;padding:0 2px}
.tl li.done .dot{background:var(--gold);border-color:var(--gold)}
.tl li.now .dot{background:var(--caramel);border-color:var(--gold-2);box-shadow:0 0 0 6px rgba(201,162,77,.25)}
.tl li.done .lb,.tl li.now .lb{color:var(--choc);font-weight:700}
.canc-note{margin:12px 0;padding:10px 14px;border-radius:12px;background:#f2d9d5;color:var(--danger);font-weight:600}

/* orders */
.tools{display:grid;gap:10px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.7);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;color:var(--choc-3);min-height:36px}
.chip[aria-pressed=true]{background:var(--choc);color:var(--gold-2);border-color:var(--choc)}
.olist{display:grid;gap:12px}
.ord{display:block;color:inherit;padding:16px;border-radius:18px;background:rgba(255,252,245,.9);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .3s var(--ease),box-shadow .3s,border-color .3s}
.ord:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 18px 30px -18px rgba(43,24,16,.6)}
.ord .r1,.ord .r2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ord .r2{margin-top:8px;font-size:14px}
.ord .items{margin-top:8px;font-size:13px;color:var(--muted)}
.ord .trk{margin-top:8px;font-size:13px;color:var(--ok);font-weight:600}
.ord .price{font-weight:800;color:var(--choc)}
.kv{display:grid;gap:10px}
.kv>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv>div:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted);flex:none}
.kv span:last-child{text-align:left;font-weight:600;min-width:0;overflow-wrap:anywhere}
.kv.total>div:last-child{font-size:17px;font-weight:800;color:var(--choc)}
.grid2{display:grid;gap:16px}
@media(min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.trkbox{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px;border-radius:16px;background:linear-gradient(135deg,#fff7e3,#f4e3bd);border:1px dashed var(--gold)}
.trkbox code{font-size:17px;font-weight:800;letter-spacing:.06em;direction:ltr;unicode-bidi:isolate;overflow-wrap:anywhere}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin-bottom:12px}
.itbl{width:100%;border-collapse:collapse;font-size:14px}
.itbl th{font-size:12px;color:var(--muted);text-align:right;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.itbl td{padding:10px 4px;border-bottom:1px dashed var(--line);vertical-align:top}
.itbl td:last-child,.itbl th:last-child{text-align:left}

/* forms */
.field{display:grid;gap:6px;margin:0 0 14px;font-weight:600;font-size:14px}
input,textarea,select{width:100%;background:#fffdf8;border:1px solid rgba(91,58,40,.28);border-radius:14px;padding:12px 14px;min-height:46px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,77,.25)}
input:disabled{background:#efe5d2;color:var(--muted)}
textarea{resize:vertical;min-height:110px}
.pw{position:relative}.pw input{padding-inline-end:70px}
.pw button{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--caramel);font-weight:700;cursor:pointer;padding:8px;min-height:36px}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.frm-msg{min-height:22px;font-size:13.5px;font-weight:600;margin:6px 0 0}
.frm-msg.err,.err{color:var(--danger)}.frm-msg.ok,.ok{color:var(--ok)}

/* support */
.thread{display:grid;gap:10px;max-height:min(55vh,480px);overflow-y:auto;padding:4px 2px 10px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14.5px;overflow-wrap:anywhere;white-space:pre-wrap}
.bub small{display:block;margin-top:4px;font-size:11px;opacity:.7}
.bub.me{justify-self:start;background:var(--choc);color:var(--ivory);border-end-start-radius:6px}
.bub.them{justify-self:end;background:#fff3d6;border:1px solid #ecd49a;border-end-end-radius:6px}

/* club */
.pts{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{--v:0;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--v)*1%),var(--cream-2) 0);position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--ivory)}
.ring b{position:relative;font-size:24px;font-weight:800;color:var(--caramel)}
.cpn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;border:1px dashed var(--gold);background:linear-gradient(135deg,#fffaf0,#f7e8c6)}
.cpn code{font-weight:800;font-size:17px;letter-spacing:.08em;direction:ltr;unicode-bidi:isolate}
.cpn.off{opacity:.6;filter:grayscale(.5)}

/* favorites */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.prod{position:relative;border-radius:18px;overflow:hidden;background:rgba(255,252,245,.92);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .3s var(--ease)}
.prod:hover{transform:translateY(-4px)}
.prod .ph{aspect-ratio:1;background:var(--cream-2);display:grid;place-items:center;overflow:hidden}
.prod .ph img{width:100%;height:100%;object-fit:cover}
.prod .bd{padding:10px 12px 12px;display:grid;gap:4px;font-size:14px}
.prod .bd b{font-weight:700;color:var(--choc)}
.heart{position:absolute;top:8px;inset-inline-start:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,252,245,.92);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 14px -6px rgba(0,0,0,.5);transition:transform .25s var(--ease)}
.heart:hover{transform:scale(1.12)}
.heart svg{width:22px;height:22px;stroke:var(--caramel);fill:none;stroke-width:1.8}
.heart[aria-pressed=true] svg{fill:var(--caramel)}
.heart[disabled]{opacity:.6}

/* misc */
.sk{border-radius:16px;background:linear-gradient(100deg,#efe2c6 30%,#fbf3df 50%,#efe2c6 70%);background-size:220% 100%;animation:sh 1.3s linear infinite;height:84px}
@keyframes sh{to{background-position:-220% 0}}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.empty .em{font-size:38px;display:block;margin-bottom:6px}
.errbox{padding:14px;border-radius:14px;background:#f8e3df;color:var(--danger);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
#toast{position:fixed;inset-inline:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:60;display:flex;justify-content:center;pointer-events:none}
#toast div{pointer-events:auto;max-width:460px;padding:12px 18px;border-radius:14px;background:var(--choc);color:var(--ivory);border:1px solid var(--gold);box-shadow:0 14px 30px -10px rgba(0,0,0,.6);font-weight:600;font-size:14px;animation:rise .35s var(--ease)}
#toast div.err{background:#5c1d17;color:#ffe6e1}
.lo-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--gold-2);font-size:13px}

/* auth */
.authw{position:relative;z-index:2;min-height:calc(100vh - 57px);display:grid;place-items:center;padding:24px 16px}
.authc{width:100%;max-width:460px;padding:26px 22px;border-radius:26px;background:rgba(255,252,245,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(201,162,77,.55);box-shadow:0 34px 60px -26px rgba(43,24,16,.7);animation:rise .7s var(--ease) both}
.authc h1{font-size:25px;font-weight:800;color:var(--choc);text-align:center}
.authc .sub{text-align:center;color:var(--muted);margin:6px 0 18px;font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border-radius:16px;background:var(--cream-2);margin-bottom:18px}
.seg button{border:0;background:transparent;padding:10px;border-radius:12px;cursor:pointer;font-weight:700;color:var(--choc-3);min-height:42px;transition:all .3s var(--ease)}
.seg button[aria-selected=true]{background:var(--choc);color:var(--gold-2);box-shadow:0 8px 16px -10px #000}
.linkbtn{background:none;border:0;color:var(--caramel);font-weight:700;cursor:pointer;padding:6px 0;min-height:36px}

@media(prefers-reduced-motion:reduce){

/* ---------- routing ---------- */
function parseHash(){
  var h=decodeURIComponent((location.hash||"").replace(/^#/,""));var p=h.split("/");
  var tab=TABS.some(function(t){return t[0]===p[0]})?p[0]:"overview";
  return {tab:tab,sub:p[1]||""};
}
function route(){
  if(!S.user){return}
  var r=parseHash();S.tab=r.tab;setNavCurrent(r.tab);
  var t=TABS.filter(function(x){return x[0]===r.tab})[0];
  document.title=t[1]+" | شیرین‌کده پاریس";
  var m=$("main");
  m.innerHTML='<div class="panel" data-panel="'+r.tab+'"></div>';
  var p=m.firstChild;
  var fn={overview:vOverview,orders:vOrders,favorites:vFavorites,club:vClub,support:vSupport,profile:vProfile}[r.tab];
  fn(p,r.sub);

}
function stagger(p){Array.prototype.forEach.call(p.children,function(c,i){c.style.setProperty("--i",i)})}

/* ---------- data loading ---------- */
function q(builder){ return builder.then(function(r){ if(r.error)throw r.error; return r.data; }); }
function loadCore(){
  var uid=S.user.id,tok=S.tok;
  var jobs=[
    q(sb.from("profiles").select("id,full_name,username,phone,email,member_number,is_active,created_at").eq("id",uid).maybeSingle()),
    q(sb.from("orders").select(ORDER_COLS).eq("user_id",uid).order("created_at",{ascending:false}).limit(200)),
    q(sb.from("club_points").select("points,updated_at").eq("user_id",uid).maybeSingle())
  ];
  return Promise.allSettled(jobs).then(function(r){
    if(tok!==S.tok)return;
    var keys=["profile","orders","points"];
    r.forEach(function(x,i){
      if(x.status==="fulfilled"){S[keys[i]]=x.value||(keys[i]==="orders"?[]:null);S.err[keys[i]]=false}
      else{console.error(x.reason);S.err[keys[i]]=true;if(keys[i]==="orders")S.orders=null}
    });
  });
}
function loadOrders(){
  S.orders=null;S.err.orders=false;
  return q(sb.from("orders").select(ORDER_COLS).eq("user_id",S.user.id).order("created_at",{ascending:false}).limit(200))
    .then(function(d){S.orders=d||[]}).catch(function(e){console.error(e);S.err.orders=true});
}
function loadMessages(){
  var tok=S.tok;
  return q(sb.from("support_messages").select("id,sender_role,message,created_at").eq("user_id",S.user.id).order("created_at",{ascending:true}).limit(500))
    .then(function(d){if(tok!==S.tok)return;S.messages=d||[];S.err.messages=false}).catch(function(e){console.error(e);S.err.messages=true});
}
function loadClub(){
  var uid=S.user.id,tok=S.tok;
  return Promise.allSettled([
    q(sb.from("club_points").select("points,updated_at").eq("user_id",uid).maybeSingle()),
    q(sb.from("club_coupons").select("id,code,discount_type,discount_value,expires_at,active,created_at").eq("user_id",uid).order("created_at",{ascending:false}).limit(100)),
    q(sb.from("coupon_redemptions").select("id,redeemed_at,coupons(code,title)").eq("user_id",uid).order("redeemed_at",{ascending:false}).limit(50))
  ]).then(function(r){
    if(tok!==S.tok)return;
    if(r[0].status==="fulfilled"){S.points=r[0].value||null}
    S.coupons=r[1].status==="fulfilled"?(r[1].value||[]):null;
    S.redemptions=r[2].status==="fulfilled"?(r[2].value||[]):null;
    S.err.club=(r[1].status!=="fulfilled");
    r.forEach(function(x){if(x.status==="rejected")console.error(x.reason)});
  });
}
function loadFavs(){
  var uid=S.user.id,tok=S.tok;

  ]).then(function(r){

/* ---------- display helpers ---------- */
function displayName(){

function badge(status){
  var n=norm(status||STEPS[0]),c="b-pend";
  if(n===STEPS_N[1])c="b-prep";else if(n===STEPS_N[2])c="b-ship";else if(n===STEPS_N[3])c="b-done";else if(n===CANCEL_N)c="b-canc";
  return '<span class="badge '+c+'">'+esc(status||STEPS[0])+'</span>';
}
function timeline(status){
  var n=norm(status||STEPS[0]);
  if(n===CANCEL_N)return '<div class="canc-note">این سفارش لغو شده است.</div>';
  var i=STEPS_N.indexOf(n);if(i<0)return "";
  return '<ol class="tl" style="--p:0" data-p="'+i+'" aria-label="مراحل سفارش">'+STEPS.map(function(s,k){
    return '<li class="'+(k<i?"done":k===i?"now":"")+'"'+(k===i?' aria-current="step"':'')+'><span class="dot"></span><span class="lb">'+esc(s)+'</span></li>';
  }).join("")+'</ol>';
}
function animateTimeline(root){
  root.querySelectorAll(".tl[data-p]").forEach(function(t){
    var v=t.getAttribute("data-p");
    if(reduce.matches){t.style.setProperty("--p",v)}else{requestAnimationFrame(function(){requestAnimationFrame(function(){t.style.setProperty("--p",v)})})}
  });
}
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(function(el){
    var end=Number(el.getAttribute("data-count"))||0,money_=el.hasAttribute("data-money");
    var fmt=function(v){return money_?money(v):num(v)};
    if(reduce.matches||end===0){el.textContent=fmt(end);return}
    var t0=performance.now(),dur=900;
    (function step(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=fmt(end*e);if(k<1)requestAnimationFrame(step)})(t0);
  });
}
function itemsOf(o){return Array.isArray(o.items)?o.items:[]}
function itemName(i){return (i&&(i.name||i.title))||"محصول"}
function itemQty(i){var q_=Number(i&&(i.qty!=null?i.qty:i.quantity));return isFinite(q_)&&q_>0?q_:1}
function itemPrice(i){var p=Number(i&&(i.price!=null?i.price:i.unit_price));return isFinite(p)&&i&&(i.price!=null||i.unit_price!=null)?p:null}
function itemsSummary(o){
  var it=itemsOf(o);if(!it.length)return "جزئیات اقلام ثبت نشده است";
  var s=it.slice(0,2).map(function(i){return esc(itemName(i))+" × "+num(itemQty(i))}).join("، ");
  return s+(it.length>2?" و "+num(it.length-2)+" مورد دیگر":"");
}

/* ---------- member card tilt ---------- */
function bindTilt(root){
  var c=root.querySelector("#mcard");if(!c)return;
  c.addEventListener("pointermove",function(e){
    if(reduce.matches)return;var r=c.getBoundingClientRect();
    var x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    c.style.setProperty("--ry",(x*-18)+"deg");c.style.setProperty("--rx",(y*14)+"deg");
  });
  c.addEventListener("pointerleave",function(){c.style.setProperty("--ry","0deg");c.style.setProperty("--rx","0deg")});
}

function applyUser(user){
  if(!user){ S.tok++; var wasIn=!!S.user; resetState(); S.tok++; showAuth(); return Promise.resolve(wasIn); }
  if(S.user&&S.user.id===user.id&&S.ready){S.user=user;return Promise.resolve()}
  S.user=user;S.ready=false;var tok=++S.tok;
  showApp();

    route();
  });
}

  $("tabLogin").onclick=function(){sw("login")};$("tabSignup").onclick=function(){sw("signup")};
  $("toForgot").onclick=function(){sw("forgot")};$("fromForgot").onclick=function(){sw("login")};
  $("loginForm").addEventListener("submit",function(e){
    e.preventDefault();var btn=e.submitter||e.target.querySelector("button[type=submit]");
    if(!sb){fieldMsg("liMsg","اتصال به سرویس حساب برقرار نشد؛ صفحه را دوباره بارگذاری کنید.","err");return}
    var email=$("liEmail").value.trim(),pass=$("liPass").value;
    if(!email||!pass){fieldMsg("liMsg","ایمیل و رمز عبور را وارد کنید.","err");return}
    fieldMsg("liMsg","");busy(btn,true,"در حال ورود…");
    sb.auth.signInWithPassword({email:email,password:pass}).then(function(r){
      if(r.error)throw r.error;$("liPass").value="";return applyUser(r.data.user||(r.data.session&&r.data.session.user));
    }).then(function(){toast("با موفقیت وارد شدید.")}).catch(function(x){fieldMsg("liMsg",errMsg(x,"ورود انجام نشد؛ دوباره تلاش کنید."),"err")}).then(function(){busy(btn,false)});
  });
  $("signupForm").addEventListener("submit",function(e){
    e.preventDefault();var btn=e.submitter||e.target.querySelector("button[type=submit]");
    if(!sb){fieldMsg("suMsg","اتصال به سرویس حساب برقرار نشد؛ صفحه را دوباره بارگذاری کنید.","err");return}
    var name=$("suName").value.trim(),user=$("suUser").value.trim(),phone=$("suPhone").value.trim(),email=$("suEmail").value.trim().toLowerCase(),pass=$("suPass").value;
    if(!name||!user||!email){fieldMsg("suMsg","نام، نام کاربری و ایمیل را وارد کنید.","err");return}
    if(pass.length<6){fieldMsg("suMsg","رمز عبور باید حداقل ۶ نویسه باشد.","err");return}
    fieldMsg("suMsg","");busy(btn,true,"در حال ساخت حساب…");
    sb.auth.signUp({email:email,password:pass,options:{emailRedirectTo:location.origin+location.pathname,data:{full_name:name,username:user,phone:phone}}}).then(function(r){
      if(r.error)throw r.error;
      if(r.data.session){$("suPass").value="";return applyUser(r.data.session.user).then(function(){toast("حساب شما ساخته شد.")})}
      fieldMsg("suMsg","حساب ساخته شد؛ برای فعال‌سازی، پیوند ارسال‌شده به ایمیل خود را باز کنید.","ok");
    }).catch(function(x){fieldMsg("suMsg",errMsg(x,"ثبت‌نام انجام نشد؛ دوباره تلاش کنید."),"err")}).then(function(){busy(btn,false)});
  });
  $("forgotForm").addEventListener("submit",function(e){
    e.preventDefault();var btn=e.submitter||e.target.querySelector("button[type=submit]");
    if(!sb){fieldMsg("fgMsg","اتصال به سرویس حساب برقرار نشد.","err");return}
    var email=$("fgEmail").value.trim();if(!email){fieldMsg("fgMsg","ایمیل را وارد کنید.","err");return}
    fieldMsg("fgMsg","");busy(btn,true,"در حال ارسال…");
    sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}).then(function(r){
      if(r.error)throw r.error;fieldMsg("fgMsg","اگر این ایمیل در سیستم ثبت شده باشد، پیوند تغییر رمز برای آن ارسال می‌شود.","ok");
    }).catch(function(x){fieldMsg("fgMsg",errMsg(x,"ارسال پیوند ناموفق بود."),"err")}).then(function(){busy(btn,false)});
  });
}

/* ---------- delegated actions ---------- */
function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){
    try{var ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");document.body.removeChild(ta);ok?res():rej(new Error("copy"))}catch(e){rej(e)}
  });
}
function loAsk(scope){
  scope.innerHTML='<div class="lo-confirm"><span>از حساب خارج می‌شوید؟</span><button type="button" class="btn sm gold" data-act="lo-yes">بله، خروج</button><button type="button" class="btn sm" data-act="lo-no">انصراف</button></div>';
  var b=scope.querySelector("[data-act=lo-yes]");if(b)b.focus();
}
function loReset(){buildNav();setNavCurrent(S.tab);if(S.user&&S.tab==="profile")route()}
function logout(scopeName){
  if(!sb)return Promise.resolve();
  return sb.auth.signOut(scopeName?{scope:scopeName}:undefined).then(function(r){
    if(r&&r.error)throw r.error;
    applyUser(null);wipePersonalUI();history.replaceState(null,"",location.pathname);toast(scopeName==="global"?"از همه دستگاه‌ها خارج شدید.":"از حساب خارج شدید.");
  }).catch(function(e){toast(errMsg(e,"خروج انجام نشد؛ دوباره تلاش کنید."),true);loReset()});
}
document.addEventListener("click",function(e){
  var sp=e.target.closest("[data-showpw]");
  if(sp){var inp=$(sp.getAttribute("data-showpw"));var show=inp.type==="password";inp.type=show?"text":"password";sp.textContent=show?"پنهان":"نمایش";return}
  var f=e.target.closest("[data-filter]");
  if(f){S.filter=f.getAttribute("data-filter");var p=document.querySelector('[data-panel="orders"]');if(p){paintChips(p);paintOrders(p)}return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="lo-ask"){loAsk(b.closest("[data-lo]")||b.parentNode);return}
  if(act==="lo-no"){loReset();return}
  if(act==="lo-yes"){b.disabled=true;logout();return}
  if(act==="lo-all"){b.disabled=true;logout("global");return}
  if(act==="copy"){copyText(b.getAttribute("data-text")).then(function(){toast("کپی شد.")}).catch(function(){toast("کپی خودکار ممکن نشد؛ متن را دستی انتخاب کنید.",true)});return}
  if(act==="reload-orders"||act==="retry-core"){
    S.orders=null;S.err.orders=false;route();
    (act==="retry-core"?loadCore():loadOrders()).then(function(){route()});return}
  if(act==="reload-msgs"){S.messages=null;S.err.messages=false;var pp=document.querySelector('[data-panel="support"]');if(pp)paintThread(pp);loadMessages().then(function(){var q_=document.querySelector('[data-panel="support"]');if(q_)paintThread(q_,true)});return}
  if(act==="reload-club"){loadClub().then(function(){var q_=document.querySelector('[data-panel="club"]');if(q_)paintClub(q_)});return}
  if(act==="reload-favs"){S.favs=null;S.err.favs=false;loadFavs().then(function(){var q_=document.querySelector('[data-panel="favorites"]');if(q_)paintFavs(q_)});return}
  if(act==="ask-support"){S.draft="درباره سفارش "+b.getAttribute("data-code")+": ";return}
  if(act==="refresh-track"){
    var code=b.getAttribute("data-code");busy(b,true,"در حال بررسی…");
    q(sb.from("orders").select(ORDER_COLS).eq("user_id",S.user.id).eq("code",code).maybeSingle()).then(function(d){
      if(!d)throw new Error("not found");
      var i=(S.orders||[]).findIndex(function(x){return String(x.code)===code});
      if(i>-1)S.orders[i]=d;
      var p=document.querySelector('[data-panel="orders"]');if(p&&parseHash().sub===code){vOrderDetail(p,code);var m=p.querySelector("#trkMsg");if(m){m.textContent="وضعیت سفارش بروزرسانی شد.";m.className="frm-msg ok"}}
    }).catch(function(x){var m=document.getElementById("trkMsg");console.error(x);if(m){m.textContent="بروزرسانی وضعیت ناموفق بود؛ کمی بعد دوباره تلاش کنید.";m.className="frm-msg err"}busy(b,false)});
    return}
  if(act==="fav"){
    var id=b.getAttribute("data-id"),isFav=b.getAttribute("aria-pressed")==="true";b.disabled=true;
    var op=isFav?sb.from("customer_favorites").delete().eq("user_id",S.user.id).eq("product_id",id):sb.from("customer_favorites").insert({user_id:S.user.id,product_id:id});
    op.then(function(r){
      if(r.error)throw r.error;
      if(isFav)S.favs=S.favs.filter(function(x){return String(x.product_id)!==id});else S.favs=[{product_id:id,created_at:new Date().toISOString()}].concat(S.favs);
      var p=document.querySelector('[data-panel="favorites"]');if(p)paintFavs(p);
      toast(isFav?"از علاقه‌مندی‌ها حذف شد.":"به علاقه‌مندی‌ها اضافه شد.");
    }).catch(function(x){b.disabled=false;toast(errMsg(x,"ذخیره علاقه‌مندی ناموفق بود."),true)});
    return}
});
document.addEventListener("input",function(e){
  if(e.target.id==="oq"){S.q=e.target.value;var p=document.querySelector('[data-panel="orders"]');if(p)paintOrders(p)}
});
document.addEventListener("submit",function(e){
  var id=e.target.id;
  if(id==="msgForm"){
    e.preventDefault();var ta=$("msgText"),btn=e.submitter||e.target.querySelector("button[type=submit]"),msg=ta.value.trim();
    if(!msg){fieldMsg("msgMsg","متن پیام را وارد کنید.","err");return}
    if(msg.length>2000){fieldMsg("msgMsg","پیام نباید بیشتر از ۲۰۰۰ نویسه باشد.","err");return}
    fieldMsg("msgMsg","");busy(btn,true,"در حال ارسال…");
    sb.from("support_messages").insert({user_id:S.user.id,sender_role:"user",message:msg}).then(function(r){
      if(r.error)throw r.error;ta.value="";ta.dispatchEvent(new Event("input"));toast("پیام شما ارسال شد.");return loadMessages();
    }).then(function(){var p=document.querySelector('[data-panel="support"]');if(p)paintThread(p,true)}).catch(function(x){fieldMsg("msgMsg",errMsg(x,"ارسال پیام ناموفق بود؛ متن شما حفظ شده است."),"err")}).then(function(){busy(btn,false)});
  }
  if(id==="profForm"){
    e.preventDefault();var btn2=e.submitter||e.target.querySelector("button[type=submit]");
    var v={full_name:$("pfName").value.trim(),username:$("pfUser").value.trim(),phone:$("pfPhone").value.trim()};
    if(!v.full_name){fieldMsg("pfMsg","نام و نام خانوادگی را وارد کنید.","err");return}
    fieldMsg("pfMsg","");busy(btn2,true,"در حال ذخیره…");
    var authOk=false;
    sb.auth.updateUser({data:v}).then(function(r){
      if(r.error)throw r.error;authOk=true;S.user=r.data.user||S.user;
      return sb.from("profiles").update(v).eq("id",S.user.id).select("id,full_name,username,phone,email,member_number,is_active,created_at").maybeSingle();
    }).then(function(r){
      if(r.error)throw r.error;if(r.data)S.profile=r.data;else if(S.profile)S.profile=Object.assign({},S.profile,v);
      fieldMsg("pfMsg","اطلاعات حساب ذخیره شد.","ok");toast("اطلاعات حساب ذخیره شد.");
    }).catch(function(x){
      fieldMsg("pfMsg",authOk?"نام در حساب شما ذخیره شد، اما بروزرسانی پروفایل فروشگاه کامل نشد؛ دوباره ذخیره کنید.":errMsg(x,"ذخیره اطلاعات ناموفق بود."),"err");
    }).then(function(){busy(btn2,false)});
  }
  if(id==="pwForm"){
    e.preventDefault();var btn3=e.submitter||e.target.querySelector("button[type=submit]");
    var a=$("pwNew").value,b2=$("pwNew2").value;
    if(a.length<6){fieldMsg("pwMsg","رمز عبور باید حداقل ۶ نویسه باشد.","err");return}
    if(a!==b2){fieldMsg("pwMsg","تکرار رمز عبور با رمز جدید یکسان نیست.","err");return}
    fieldMsg("pwMsg","");busy(btn3,true,"در حال تغییر…");
    sb.auth.updateUser({password:a}).then(function(r){
      if(r.error)throw r.error;$("pwNew").value="";$("pwNew2").value="";fieldMsg("pwMsg","رمز عبور با موفقیت تغییر کرد.","ok");toast("رمز عبور تغییر کرد.");
    }).catch(function(x){fieldMsg("pwMsg",errMsg(x,"تغییر رمز عبور ناموفق بود."),"err")}).then(function(){busy(btn3,false)});
  }
});

/* ---------- 3D scene (Three.js, progressive enhancement) ---------- */
var scene={on:false};
function loadThree(){
  return new Promise(function(res){
    if(window.THREE)return res(true);
    var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js";s.async=true;
    s.onload=function(){res(!!window.THREE)};s.onerror=function(){res(false)};document.head.appendChild(s);
  });
}
function startScene(){
  var T=window.THREE,cv=$("scene");if(!T||!cv)return false;
  var r;try{r=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:window.devicePixelRatio<2,powerPreference:"low-power"})}catch(e){return false}
  r.setClearColor(0x000000,0);
  var sc=new T.Scene(),cam=new T.PerspectiveCamera(45,1,.1,60);cam.position.set(0,0,9);
  sc.add(new T.AmbientLight(0xfff0dc,.9));
  var key=new T.DirectionalLight(0xffe2b0,1.5);key.position.set(4,6,6);sc.add(key);
  var rim=new T.PointLight(0xc9a24d,1.3,40);rim.position.set(-6,-2,5);sc.add(rim);
  var gold=new T.MeshStandardMaterial({color:0xd4af5a,metalness:.65,roughness:.3,emissive:0x3a2a08,emissiveIntensity:.45});
  var small=window.innerWidth<700,items=[];
  function put(obj,depth,sp){
    sc.add(obj);items.push({o:obj,nx:Math.random()*2-1,ny:Math.random()*2-1,z:depth,ph:Math.random()*6.28,sp:sp,rs:(Math.random()*.5+.15)*(Math.random()<.5?-1:1),s:0});
  }
  for(var j=0;j<(small?2:4);j++){var rg=new T.Mesh(new T.TorusGeometry(.7+Math.random()*.6,.035,16,80),gold);rg.rotation.x=Math.random()*3;put(rg,-2-Math.random()*4,.4+Math.random()*.4)}
  var cnt=small?90:180,pos=new Float32Array(cnt*3);
  for(var n=0;n<cnt;n++){pos[n*3]=(Math.random()*2-1)*10;pos[n*3+1]=(Math.random()*2-1)*7;pos[n*3+2]=-Math.random()*8}
  var pg=new T.BufferGeometry();pg.setAttribute("position",new T.BufferAttribute(pos,3));
  var dust=new T.Points(pg,new T.PointsMaterial({color:0xc9a24d,size:.045,transparent:true,opacity:.65,depthWrite:false}));sc.add(dust);
  var hw=5,hh=4,mx=0,my=0,tmx=0,tmy=0,W=0,H=0;
  function size(){
    W=window.innerWidth;H=window.innerHeight;r.setPixelRatio(Math.min(window.devicePixelRatio||1,small?1.5:1.75));r.setSize(W,H,false);
    cam.aspect=W/H;cam.updateProjectionMatrix();hh=Math.tan(cam.fov*Math.PI/360)*cam.position.z;hw=hh*cam.aspect;
  }
  size();window.addEventListener("resize",size);
  window.addEventListener("pointermove",function(e){tmx=e.clientX/W-.5;tmy=e.clientY/H-.5},{passive:true});
  function wrap(v,lo,hi){var s=hi-lo;return ((v-lo)%s+s)%s+lo}
  var clock=new T.Clock(),raf=0;
  function frame(still){
    var t=clock.getElapsedTime(),sy=window.scrollY||0;
    mx+=(tmx-mx)*.04;my+=(tmy-my)*.04;
    cam.position.x=mx*1.2;cam.position.y=-my*.8;cam.lookAt(0,0,0);
    items.forEach(function(it){
      var par=1/(1+Math.abs(it.z)*.35),y=wrap(it.ny*hh+sy*.0042*par*3,-hh-1.6,hh+1.6);
      it.o.position.set(it.nx*hw,y+Math.sin(t*it.sp+it.ph)*.22,it.z);
      if(!still){it.o.rotation.y+=it.rs*.012;it.o.rotation.z=Math.sin(t*it.sp*.7+it.ph)*.25}
    });
    if(!still)dust.rotation.y=t*.012;
    r.render(sc,cam);
  }
  function loop(){raf=requestAnimationFrame(loop);if(document.hidden)return;frame(false)}
  function apply(){cancelAnimationFrame(raf);if(reduce.matches){frame(true)}else{loop()}}
  if(reduce.addEventListener)reduce.addEventListener("change",apply);
  window.addEventListener("scroll",function(){if(reduce.matches)frame(true)},{passive:true});
  window.addEventListener("resize",function(){if(reduce.matches)frame(true)});
  apply();
  cv.addEventListener("webglcontextlost",function(ev){ev.preventDefault();cancelAnimationFrame(raf);document.documentElement.classList.remove("gl")});
  return true;
}
function initScene(){
  var saver=navigator.connection&&navigator.connection.saveData;
  if(saver){return}
  loadThree().then(function(ok){ if(ok&&startScene()){scene.on=true;document.documentElement.classList.add("gl")} });
}

/* ---------- boot ---------- */
function boot(){
  buildNav();bindAuth();
  if(!sb){ showAuth(); fieldMsg("liMsg","اتصال به سرویس حساب برقرار نشد؛ اینترنت خود را بررسی کنید و صفحه را دوباره بارگذاری کنید.","err"); return; }
  sb.auth.getSession().then(function(r){ return applyUser((r.data&&r.data.session&&r.data.session.user)||null); }).catch(function(e){console.error(e);showAuth()});
  sb.auth.onAuthStateChange(function(ev,session){
    setTimeout(function(){
      if(ev==="SIGNED_OUT"){ if(S.user){applyUser(null);wipePersonalUI()} }
      else if(ev==="SIGNED_IN"&&session&&session.user){ if(!S.user||S.user.id!==session.user.id)applyUser(session.user) }
      else if(ev==="USER_UPDATED"&&session&&session.user){ S.user=session.user }
      else if(ev==="PASSWORD_RECOVERY"&&session&&session.user){
        applyUser(session.user).then(function(){location.hash="#profile";toast("رمز عبور جدید خود را در بخش «تغییر رمز عبور» وارد کنید.")});
      }
    },0);
  });
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
window.addEventListener("load",function(){ (window.requestIdleCallback||function(f){setTimeout(f,400)})(initScene) });
})();
</script>
