name: Guard index.html

on:
  push:
    branches: [main]
    paths: [index.html]

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip-guard]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html if a stale copy was pushed
        run: bash .github/guard/check-index.sh
